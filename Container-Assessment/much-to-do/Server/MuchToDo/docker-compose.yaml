services:
  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"

  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - mongodb

  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
    depends_on:
      - mongodb
